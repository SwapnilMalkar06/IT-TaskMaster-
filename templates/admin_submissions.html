{% extends "layout.html" %}
{% block title %}Submission Audit{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark"><i class="bi bi-clipboard-check-fill me-2 text-primary"></i>Task Submissions Audit</h3>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Employee & Task</th>
                        <th>Submission Proof</th>
                        <th>Admin Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for sub in submissions %}
                    <tr>
                        <td class="ps-4">
                            <div class="fw-bold">{{ sub.emp_name }}</div>
                            <div class="small text-muted">{{ sub.title }}</div>
                        </td>
                        <td>
                            <div class="d-flex gap-2 align-items-center">
                                <a href="{{ url_for('static', filename='uploads/submissions/' + sub.submission_file) }}" 
                                   target="_blank" class="btn btn-sm btn-light border text-primary">
                                    <i class="bi bi-file-earmark-text"></i> View
                                </a>
                                <small class="text-muted d-block text-truncate" style="max-width: 150px;">{{ sub.remarks }}</small>
                            </div>
                        </td>
                        <td>
                            <form action="{{ url_for('verify_submission', id=sub.id) }}" method="POST" class="d-flex gap-2">
                                <select name="ver_status" class="form-select form-select-sm rounded-3 w-auto" onchange="this.form.submit()">
                                    <option value="Pending Review" {% if sub.verification_status == 'Pending Review' %}selected{% endif %}>Pending Review</option>
                                    <option value="Verified" {% if sub.verification_status == 'Verified' %}selected{% endif %}>Verified</option>
                                    <option value="Re-do Required" {% if sub.verification_status == 'Re-do Required' %}selected{% endif %}>Re-do Required</option>
                                </select>
                            </form>
                        </td>
                        <td class="text-center">
                            <a href="{{ url_for('delete_submission', id=sub.id) }}" 
                               class="btn btn-sm btn-outline-danger rounded-circle" 
                               onclick="return confirm('Delete this submission record?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
